name = 'ux-design'
description = 'Product design & UX specialist for user-facing pages and reports — visual design, information hierarchy, UX writing, and design critique. Two modes: (1) Design/implement: restyle or build UI with a coherent system (loads the frontend-design, dataviz, and design-system-patterns skills first). (2) Critique: walk through a running product AS the target user and return prioritized findings (missing / confusing / broken), before any redesign. Use for design passes, UX reviews of reports/dashboards, copy audits, and pre-launch walkthroughs. Framework-agnostic (server-rendered templates, React, or plain HTML).'
